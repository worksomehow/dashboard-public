<title>하루척척</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{--ink:#1f2a44;--sun:#ffd23f;--red:#ef4a4a;--mint:#2fc47a;--glass:rgba(255,255,255,.9)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
html,body{margin:0}
body{font-family:'Jua','Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:var(--ink);display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;overflow-x:hidden;overscroll-behavior-y:contain;-webkit-user-select:none;-webkit-touch-callout:none;padding:max(18px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));background:linear-gradient(#4fb8ff,#a8e4ff 55%,#dcf7ff)}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:
 radial-gradient(ellipse 150px 46px at 16% 12%,rgba(255,255,255,.95),rgba(255,255,255,0) 72%),
 radial-gradient(ellipse 210px 56px at 58% 8%,rgba(255,255,255,.85),rgba(255,255,255,0) 72%),
 radial-gradient(ellipse 130px 40px at 90% 20%,rgba(255,255,255,.9),rgba(255,255,255,0) 72%)}
body::after{content:'';position:fixed;left:0;right:0;bottom:0;height:26vh;pointer-events:none;background:
 radial-gradient(ellipse 62% 100% at 22% 100%,#62d36e 0 98%,transparent 100%),
 radial-gradient(ellipse 72% 90% at 82% 100%,#3fb55a 0 98%,transparent 100%)}
.app{position:relative;z-index:1;flex:1;display:grid;gap:18px;grid-template-columns:1.05fr 1fr 1.1fr;grid-template-rows:auto minmax(340px,1fr) auto;grid-template-areas:"clock wx cd" "tasks tasks tasks" "bottom bottom bottom"}
.clockc{grid-area:clock}.wxc{grid-area:wx}.cd{grid-area:cd}.tasks{grid-area:tasks}.bottom{grid-area:bottom}
.card,.cd{background:var(--glass);border:3px solid #fff;border-radius:30px;box-shadow:0 8px 0 rgba(31,42,68,.16),0 18px 30px rgba(20,60,120,.2)}
.side{display:contents}
.clockc{position:relative;flex:1.15;display:flex;flex-direction:column;justify-content:center;padding:14px 24px;color:#fff;background:linear-gradient(160deg,#2c3d7c,#17224a);border-color:#4a5fa8}
#clock{font-size:clamp(48px,6.6vw,86px);line-height:1;text-shadow:0 0 26px rgba(120,200,255,.65)}
#clock small{font-size:.3em;margin-right:8px;color:var(--sun);text-shadow:none}
#date{font-size:22px;color:#a9dcff;margin-top:6px}
#gear{position:absolute;top:10px;right:12px;border:0;background:none;font-size:24px;opacity:.5;color:#fff;padding:6px}
.wxc{display:flex;align-items:center;gap:16px;padding:12px 22px}
#wxp{font-size:15px;opacity:.65}#wxi{font-size:56px;line-height:1}#wxt{font-size:26px}#wxs{font-size:16px;opacity:.75;line-height:1.35}
.cd{padding:12px 20px 16px;transition:border-color .4s}
.cdh b{font-weight:400;font-size:20px;opacity:.8}
#left{font-size:clamp(32px,4vw,52px);line-height:1.1;margin-top:2px}
.cd.late #left{color:var(--red)}
.hp{display:flex;align-items:center;gap:10px;margin-top:8px}
.hp span{background:var(--ink);color:#fff;border-radius:8px;padding:0 8px;font-size:17px}
.bar{flex:1;height:20px;border-radius:11px;background:#2a3558;padding:3px}
#fill{height:100%;width:100%;border-radius:8px;background:linear-gradient(#8af59a,#2fc47a);transition:width 1s linear}
.cd.warn #fill{background:linear-gradient(#ffe46b,#ffb800)}
.cd.late #fill{background:linear-gradient(#ff9a9a,#ef4a4a)}
.tasks{display:grid;grid-template-columns:repeat(var(--n,4),1fr);grid-template-rows:1fr;gap:20px;min-height:0;padding-bottom:12px}
.task{--sh:inset 0 -10px 0 rgba(0,0,0,.14),inset 0 4px 0 rgba(255,255,255,.5);position:relative;overflow:hidden;font:inherit;color:var(--ink);border:0;border-radius:34px;background:linear-gradient(165deg,var(--c1),var(--c2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-shadow:var(--sh),0 10px 0 var(--edge),0 20px 26px rgba(0,0,0,.2);transition:transform .12s,box-shadow .12s}
.task:nth-child(1){--c1:#ffc15d;--c2:#ff8a3d;--edge:#d9661a}
.task:nth-child(2){--c1:#6fd0ff;--c2:#2f9bff;--edge:#1f78d1}
.task:nth-child(3){--c1:#86e89c;--c2:#2fc47a;--edge:#1f9a5c}
.task:nth-child(4){--c1:#cfa6ff;--c2:#8f6bff;--edge:#6a48d6}
.task:nth-child(5){--c1:#ffa6cf;--c2:#ff6fa8;--edge:#d9457f}
.task::before{content:'';position:absolute;left:-10%;top:-34%;width:120%;height:58%;background:rgba(255,255,255,.2);border-radius:50%}
.task:active{transform:translateY(8px);box-shadow:var(--sh),0 2px 0 var(--edge),0 6px 12px rgba(0,0,0,.2)}
.e{position:relative;width:clamp(76px,13vw,150px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#eef4ff);display:grid;place-items:center;font-size:clamp(44px,7.4vw,84px);line-height:1;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.l{position:relative;background:#fff;border-radius:22px;padding:6px 18px;font-size:clamp(20px,2.7vw,34px);white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.ck,.dot{position:relative;border-radius:50%;border:4px solid var(--ink);background:linear-gradient(#cbd5e6 0 44%,var(--ink) 44% 56%,#fff 56%)}
.ck::after,.dot::after{content:'';position:absolute;left:50%;top:50%;width:28%;height:28%;transform:translate(-50%,-50%);border-radius:50%;background:#fff;border:3px solid var(--ink)}
.ck{position:absolute;top:14px;right:16px;width:54px;height:54px}
.dot{width:44px;height:44px;transition:background .25s}
.task.done .ck,.dot.on{background:linear-gradient(var(--red) 0 44%,var(--ink) 44% 56%,#fff 56%)}
.task.done .ck::after,.dot.on::after{background:var(--sun)}
.task.done .ck{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.4)}}
.task.done .e{background:radial-gradient(circle at 35% 30%,#fff9d0,#ffe27a)}
.task.done::after{content:'완료!';position:absolute;left:-50px;top:22px;transform:rotate(-35deg);background:var(--sun);font-size:20px;padding:3px 52px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.bottom{display:flex;flex-wrap:wrap;row-gap:10px;align-items:center;gap:22px;padding:12px 26px}
.dots{display:flex;gap:10px;align-items:center}
#hint{font-size:24px;min-width:0}
.shelf{margin-left:auto}
.tabs{display:flex;gap:8px}
.tabs button{font:inherit;font-size:22px;border:0;border-radius:20px;padding:8px 18px;background:#eef3fb;color:var(--ink);box-shadow:0 4px 0 rgba(31,42,68,.18);opacity:.8;transition:transform .1s}
.tabs button.on{background:linear-gradient(#ffe46b,#ffc400);box-shadow:0 4px 0 #c58f00;opacity:1}
.tabs button:active{transform:translateY(3px)}
.todays{display:flex;gap:10px}
.tb{position:relative;border:3px solid #fff;border-radius:50%;background:radial-gradient(#fff8d0,#ffe27a);padding:2px;width:66px;height:66px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.tb em{position:absolute;right:-8px;bottom:-8px;font-style:normal;font-size:20px;line-height:1}
.tb img,.tb svg{width:100%;height:100%;object-fit:contain}
body.night{background:linear-gradient(#1b2766,#3d4fa8 55%,#8a93e0)}
body.night::before{opacity:.3}
body.night::after{filter:brightness(.55)}
#ov,#set,#bk{position:fixed;inset:0;background:rgba(23,34,74,.78);display:grid;place-items:center;z-index:9}
#ov[hidden],#set[hidden],#bk[hidden]{display:none}
.stage{text-align:center;color:#fff;position:relative;width:min(80vw,420px)}
#ball{width:min(46vw,260px);margin:0 auto;display:block;transition:transform .3s}
#ball.shake{animation:shk 1.4s ease-in-out}
@keyframes shk{0%,100%{transform:rotate(0)}15%{transform:rotate(-18deg)}30%{transform:rotate(16deg)}45%{transform:rotate(-14deg)}60%{transform:rotate(12deg)}80%{transform:rotate(-6deg)}}
#lid{transition:transform .5s cubic-bezier(.3,1.6,.5,1);transform-origin:8px 50px}
#ball.open #lid{transform:translate(-6px,-26px) rotate(-62deg)}
#rev{width:min(48vw,260px);margin:-10px auto 0;display:none;animation:rise .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes rise{from{transform:scale(.1) translateY(80px);opacity:0}}
#rev svg,#rev img{width:100%;display:block}
#msg{font-size:34px;margin:6px 0 12px;min-height:44px}
.go{font:inherit;font-size:30px;color:var(--ink);background:linear-gradient(#ffe46b,#ffc400);border:0;border-radius:26px;padding:10px 44px;box-shadow:0 6px 0 #c58f00}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #c58f00}
.sp{position:fixed;top:-40px;font-size:30px;animation:fall linear forwards;pointer-events:none;z-index:10}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
.panel{background:#fff;border-radius:28px;padding:24px;width:min(92vw,520px);max-height:92vh;overflow:auto;display:grid;gap:14px;font-size:22px;box-shadow:0 10px 0 rgba(0,0,0,.2)}
.panel input{font:inherit;font-size:28px;padding:6px 10px;border:3px solid #cbd5e6;border-radius:14px;color:var(--ink)}
.panel button{font:inherit;font-size:20px;padding:10px;border:0;border-radius:16px;background:#eef3fb;color:var(--ink)}
#chips{display:flex;flex-wrap:wrap;gap:6px}
#chips button,#res button{font-size:16px;padding:6px 12px;border-radius:14px}
#chips button.on{background:var(--sun)}
#res{display:grid;gap:6px;font-size:16px}
.slot{position:relative}
.slot.off .im{filter:brightness(0);opacity:.13}
.im{aspect-ratio:1}.im svg,.im img{width:100%;height:100%;display:block;object-fit:contain}
.slot small{display:block;text-align:center;font-size:14px;line-height:1.2;margin-top:2px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;overflow:auto;max-height:62vh}
@media (orientation:portrait){.app{grid-template-columns:1fr 1fr;grid-template-rows:auto auto minmax(340px,1fr) auto;grid-template-areas:"clock wx" "cd cd" "tasks tasks" "bottom bottom"}#wxi{font-size:52px}#wxt{font-size:26px}#wxs{font-size:16px}.clockc{padding:12px 20px}#clock{font-size:clamp(48px,9vw,84px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:640px) and (orientation:portrait){.app{grid-template-columns:1fr;grid-template-rows:none;grid-template-areas:"clock" "wx" "cd" "tasks" "bottom"}.tasks{grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,minmax(220px,1fr))}.bottom{flex-wrap:wrap}.shelf{margin-left:0}#clock{font-size:clamp(48px,16vw,80px)}}
@media (orientation:landscape) and (max-height:520px){
body{padding:8px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left))}
.app{gap:8px;grid-template-rows:auto minmax(0,1fr) auto}
.card,.cd{border-radius:18px;border-width:2px;box-shadow:0 4px 0 rgba(31,42,68,.16)}
.clockc{padding:6px 14px}#clock{font-size:clamp(30px,6vw,48px)}#date{font-size:13px;margin-top:2px}#gear{top:2px;right:6px;font-size:18px}
.wxc{padding:6px 12px;gap:8px}#wxi{font-size:32px}#wxt{font-size:17px}#wxs{font-size:12px;line-height:1.2}#wxp{font-size:11px}
.cd{padding:6px 12px 8px}.cdh b{font-size:13px}#left{font-size:clamp(22px,4vw,32px)}.hp{margin-top:3px}.hp span{font-size:12px}.bar{height:14px;padding:2px}
.tasks{gap:10px;padding-bottom:6px}
.task{--sh:inset 0 -6px 0 rgba(0,0,0,.14),inset 0 3px 0 rgba(255,255,255,.5);border-radius:20px;gap:6px;box-shadow:var(--sh),0 6px 0 var(--edge),0 10px 14px rgba(0,0,0,.2)}
.e{width:clamp(44px,18vh,80px);font-size:clamp(26px,10vh,48px)}.l{font-size:clamp(14px,4.4vh,20px);padding:3px 12px}
.ck{width:34px;height:34px;top:8px;right:8px;border-width:3px}.task.done::after{font-size:13px;left:-36px;top:12px;padding:2px 38px}
.bottom{padding:6px 16px;gap:12px}.dot{width:28px;height:28px;border-width:3px}#hint{font-size:16px;min-width:0}.tb{width:44px;height:44px}.tabs button{font-size:15px;padding:5px 12px}
#book{font-size:16px!important;padding:6px 16px!important}.go{font-size:18px;padding:6px 20px}
#ball,#rev{width:min(40vw,30vh)}#msg{font-size:20px;min-height:26px;margin:2px 0 6px}
.panel{max-height:94vh;overflow:auto;padding:14px;gap:8px;font-size:16px}.panel input{font-size:20px}.panel button{font-size:16px;padding:7px}
}
/* 저녁 5개 항목용 레이아웃 */
.tasks.n5{gap:14px}
.tasks.n5 .e{width:clamp(60px,11vw,130px);font-size:clamp(36px,6.4vw,72px)}
.tasks.n5 .l{font-size:clamp(17px,2.3vw,30px);padding:6px 12px}
.tasks.n5 .ck{width:44px;height:44px;top:12px;right:12px}
@media (orientation:landscape) and (max-height:520px){.tasks.n5{gap:8px}.tasks.n5 .e{width:clamp(44px,18vh,80px);font-size:clamp(26px,10vh,48px)}.tasks.n5 .l{font-size:clamp(13px,4vh,19px);padding:3px 10px}.tasks.n5 .ck{width:34px;height:34px;top:8px;right:8px}}
@media (max-width:640px) and (orientation:portrait){.tasks.n5{grid-template-rows:repeat(3,minmax(200px,1fr))}.tasks.n5 .task:last-child{grid-column:1/-1}.tasks.n5 .e{width:clamp(76px,22vw,120px);font-size:clamp(44px,12vw,64px)}.tasks.n5 .l{font-size:clamp(20px,5vw,26px)}}
</style>
</head>
<body>
<div class="app">
  <section class="side">
    <div class="card clockc"><button id="gear" aria-label="설정">⚙️</button><div id="clock"></div><div id="date"></div></div>
    <div class="card wxc"><div id="wxi">⏳</div><div><div id="wxp"></div><div id="wxt">날씨 불러오는 중</div><div id="wxs"></div></div></div>
    <div class="cd" id="cd"><div class="cdh"><b id="cdl">유치원 출발까지</b></div><div id="left">--</div><div class="hp"><span>HP</span><div class="bar"><div id="fill"></div></div></div></div>
  </section>
  <section class="tasks" id="tasks"></section>
  <section class="card bottom">
    <div class="tabs" id="tabs"><button data-p="m">☀️ 아침</button><button data-p="e">🌙 저녁</button></div>
    <div class="dots" id="dots"></div>
    <div id="hint"></div>
    <div class="todays" id="todays"></div>
    <div class="shelf" id="shelf"></div>
  </section>
</div>

<div id="ov" hidden><div class="stage">
  <svg id="ball" viewBox="0 0 100 100"><path d="M5 50a45 45 0 0 0 90 0z" fill="#fff" stroke="#26324a" stroke-width="4" stroke-linejoin="round"/><g id="lid"><path d="M5 50a45 45 0 0 1 90 0z" fill="#ee4b4b" stroke="#26324a" stroke-width="4" stroke-linejoin="round"/></g><circle cx="50" cy="50" r="11" fill="#fff" stroke="#26324a" stroke-width="4"/><circle cx="50" cy="50" r="4.5" fill="#fff" stroke="#26324a" stroke-width="2.5"/></svg>
  <div id="rev"></div><div id="msg"></div><button class="go" id="ok" hidden>좋아!</button>
</div></div>

<div id="bk" hidden><div class="panel" style="width:min(94vw,860px)"><div id="bkt" style="font-size:30px"></div><div id="grid"></div><button id="bkc">닫기</button></div></div>

<div id="set" hidden><div class="panel">
  <label>유치원 출발 시각 (아침)<br><input type="time" id="dep"></label>
  <label>잠자리 시각 (저녁)<br><input type="time" id="bed"></label>
  <button id="rd">오늘 아침 체크 다시 하기</button>
  <button id="rde">오늘 저녁 체크 다시 하기</button>
  <button id="rc">모은 친구 모두 지우기</button>

/* 실시간 날씨 (Open-Meteo) */
const WC=c=>c===0?['☀️','맑음']:c<=2?['🌤️','대체로 맑음']:c===3?['☁️','흐림']:c<=48?['🌫️','안개']:c<=57?['🌦️','이슬비']:c<=67?['🌧️','비']:c<=77?['❄️','눈']:c<=82?['🌦️','소나기']:c<=86?['🌨️','눈']:['⛈️','천둥번개'];
async function wx(){
 try{
  const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+loc.lat+'&longitude='+loc.lon+'&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&forecast_days=1');
  if(!r.ok)throw 0;const j=await r.json(),c=j.current,d=j.daily,w=WC(c.weather_code),p=d.precipitation_probability_max[0],t=Math.round(c.temperature_2m);
  $('#wxi').textContent=w[0];$('#wxt').textContent=w[1]+' '+t+'°';
  let tip=(p>=50||(c.weather_code>=51&&c.weather_code<=82))?'☂️ 우산 챙기자!':t<=5?'🧥 두꺼운 옷 입자!':t>=27?'🥤 시원하게 입자!':'😊 오늘 날씨 좋아요';
  $('#wxs').innerHTML='오늘 '+Math.round(d.temperature_2m_min[0])+'° ~ '+Math.round(d.temperature_2m_max[0])+'° · 비 '+p+'%<br>'+tip;
 }catch(e){$('#wxi').textContent='📡';$('#wxt').textContent='날씨를 못 불러왔어요';$('#wxs').textContent='인터넷 연결을 확인해 주세요'}
}
$('#wxp').textContent='📍 '+loc.n;buildTasks();render();tick();setInterval(tick,1000);wx();setInterval(wx,1800000);
</script>
